<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配手机端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给王丽娟的告白</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 渐变浪漫背景 */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 粉色渐变背景，超温柔 */
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            font-family: "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }

        /* 核心表白文字 */
        .main-text {
            font-size: 50px;
            font-weight: bold;
            color: #e63946;
            /* 文字阴影，更立体 */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            /* 轻微浮动动画 */
            animation: float 3s ease-in-out infinite;
        }

        /* 副标题点缀 */
        .sub-text {
            font-size: 22px;
            color: #457b9d;
            opacity: 0.8;
        }

        /* 浮动动画效果 */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* 小爱心动画（纯CSS，无图片） */
        .heart {
            position: absolute;
            width: 25px;
            height: 25px;
            background: #e63946;
            transform: rotate(-45deg);
            animation: heart-float 5s linear infinite;
            opacity: 0.7;
        }
        .heart::before, .heart::after {
            content: '';
            width: 25px;
            height: 25px;
            background: #e63946;
            border-radius: 50%;
            position: absolute;
        }
        .heart::before { top: -12px; left: 0; }
        .heart::after { top: 0; left: 12px; }

        /* 随机生成多个爱心 */
        .heart:nth-child(1) { left: 10%; animation-delay: 0s; }
        .heart:nth-child(2) { left: 30%; animation-delay: 1s; }
        .heart:nth-child(3) { left: 50%; animation-delay: 2s; }
        .heart:nth-child(4) { left: 70%; animation-delay: 3s; }
        .heart:nth-child(5) { left: 90%; animation-delay: 4s; }

        @keyframes heart-float {
            0% { bottom: -50px; opacity: 0; }
            50% { opacity: 0.7; }
            100% { bottom: 100vh; opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- 浮动小爱心 -->
    <div class="heart"></div>
    <div class="heart"></div>
    <div class="heart"></div>
    <div class="heart"></div>
    <div class="heart"></div>

    <!-- 核心文字 -->
    <div class="main-text">王丽娟，我喜欢你</div>
    <div class="sub-text">✨ 满心欢喜，皆是你 ✨</div>
</body>
</html>
